# =================================================
# Mod identity (same keys as forge-1.20.1; mod_version moves with it)
# =================================================
mod_id=frontiermode
mod_name=FrontierMode
mod_group_id=com.arryn
mod_version=0.3.0

mod_authors=Arryn
mod_description=Gameplay and world-expansion systems built on the Satchel framework.
mod_license=MIT

# -------------------------------------------------
# Minecraft / NeoForge
# -------------------------------------------------
minecraft_version=1.21.1
# Exactly Minecraft 1.21.1 and nothing else (a Maven range: [x] = that version only).
minecraft_version_range=[1.21.1]

neo_version=21.1.267
neo_version_range=[21.1.0,)

loader_version_range=[1,)

# =================================================
# Satchel dependency
# =================================================
satchel_mod_id=satchel_ecosystem
# Floor of the Satchel interop line (0.x.y: x is the interop version). Same value as forge-1.20.1; build.gradle
# derives the ceiling (next x, -alpha) for neoforge.mods.toml.
satchel_min_version=0.3.0

# =================================================
# Gradle / JVM
# =================================================
org.gradle.daemon=false
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=512m
