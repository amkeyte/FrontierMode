# Forge mods.toml for Frontier Mode
modLoader="javafml"
loaderVersion="[47,)"
license="${mod_license}"

[[mods]]
modId="frontiermode"
version="${mod_version}"
displayName="Frontier Mode"
authors="Arryn"
description='''
Frontier Mode: Gameplay and world-tuning modifications for Minecraft.
'''

# -------------------------------------------------
# Dependencies
# -------------------------------------------------

[[dependencies.frontiermode]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="BOTH"

[[dependencies.frontiermode]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1,1.21)"
ordering="NONE"
side="BOTH"

[[dependencies.frontiermode]]
modId="satchel"
mandatory=true
versionRange="[${satchel_min_version},)"
ordering="AFTER"
side="BOTH"
