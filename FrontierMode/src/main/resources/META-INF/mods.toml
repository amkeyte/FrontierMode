# Forge mods.toml for Frontier Mode
modLoader="javafml"
loaderVersion="[47,)"
license="${mod_license}"
issueTrackerURL="https://www.curseforge.com/minecraft/mc-mods/frontier-mode/issues"

[[mods]]
modId="frontiermode"
version="${mod_version}"
displayName="Frontier Mode"
authors="Arryn"
credits="Sound and art credits: see CREDITS_frontiermode.md"
displayURL="https://www.curseforge.com/minecraft/mc-mods/frontier-mode"
description='''
Frontier Mode: Gameplay and world-tuning modifications for Minecraft.
'''

# -------------------------------------------------
# Dependencies
# -------------------------------------------------

[[dependencies.frontiermode]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="BOTH"

[[dependencies.frontiermode]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.frontiermode]]
modId="satchel_ecosystem"
mandatory=true
versionRange="[${satchel_min_version},)"
ordering="AFTER"
side="BOTH"
