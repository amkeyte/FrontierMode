// ------------------------------------------------------------
// Tunables dev sync (FRO_165): after a run stops, copy that run's live tunables CSV over the seed in
// Satchel's resources so the next Satchel jar ships it. Spec: wiki satchel/architecture/tunables.md.
// One copy task per run task, each copying only its own live file; last run to stop wins.
// The seed path is relative to forge-1.20.1 (Satchel is a sibling of FrontierMode); the seed lives in Satchel's shared folder.
// Applied from forge-1.20.1/build.gradle ONLY (tunables are tuned on forge-1.20.1; PORT_008), via `apply from:`, so
// file()/tasks/logger resolve against forge-1.20.1.
// When the copy happens (FRO_389): a run through Gradle copies when the run task ends; an IntelliJ launch
// copies at the START of the next launch of the same side (client or server). To copy at once, run
// syncTunablesFromClient / syncTunablesFromServer. Satchel writes the live file on a clean server stop and on
// `/satchel tunables write`, so a killed run leaves only what was last written.
// ------------------------------------------------------------
def tunablesSeedFile = file("${projectDir}/../../Satchel/shared/src/main/resources/satchel-tunables.csv")
def tunablesHeader = 'name,type,min,max,default,value,shipped'
def tunablesLegacyHeader = 'name,type,min,max,default,value'

// Rows by name, each as its seven columns (a legacy six-column row gets a blank `shipped`).
def tunablesRows = { String text ->
    def rows = [:]
    text.readLines().drop(1).findAll { !it.trim().isEmpty() }.each { String line ->
        List cols = line.split(',', -1) as List
        while (cols.size() < 7) cols << ''
        rows[cols[0]] = cols
    }
    return rows
}

def syncTunablesToSeed = { File live ->
    // Fresh clone: give the seed its header so nothing downstream trips on a missing file.
    if (!tunablesSeedFile.exists() && tunablesSeedFile.parentFile.isDirectory()) {
        tunablesSeedFile.setText(tunablesHeader + '\n', 'UTF-8')
        logger.lifecycle("Created header-only tunables seed: ${tunablesSeedFile}")
    }

    if (!live.exists()) return                       // nothing to sync; silent by design
    if (!tunablesSeedFile.parentFile.isDirectory()) {
        logger.warn("Tunables sync skipped: ${tunablesSeedFile.parentFile} not found.")
        return
    }

    byte[] bytes = live.bytes
    String text = new String(bytes, 'UTF-8')
    def lines = text.readLines()
    def first = lines ? lines[0].trim() : ''
    if (first != tunablesHeader && first != tunablesLegacyHeader) {
        logger.warn("Tunables sync skipped: ${live} has an unexpected header line.")
        return
    }
    if (lines.drop(1).every { it.trim().isEmpty() }) {
        logger.warn("Tunables sync skipped: ${live} has no data rows (won't overwrite the seed with an empty file).")
        return
    }
    if (!text.endsWith('\n')) {
        logger.warn("Tunables sync skipped: ${live} doesn't end with a newline (looks truncated).")
        return
    }
    if (tunablesSeedFile.exists()) {
        def seedRows = tunablesRows(tunablesSeedFile.getText('UTF-8'))
        def liveRows = tunablesRows(text)
        // Nothing tuned: every column but `shipped` matches, so leave the seed file alone.
        if (liveRows.keySet() == seedRows.keySet()
                && seedRows.every { name, row -> liveRows[name][1..5] == row[1..5] }) return

        // Stale live file: copying it would take back a seed value it never saw (a pull, or the other run's
        // tune copied back). `shipped` is the seed value the row was last merged against, so a differing value
        // is a real tune only if `shipped` matches the seed as it is now. A seed row the live file lacks is
        // also one it never saw. The next run that starts and stops cleanly merges the file and clears this.
        def stale = seedRows.findAll { name, row ->
            def mine = liveRows[name]
            mine == null || (mine[5] != row[5] && mine[6] != row[5])
        }.keySet() as List
        if (stale && !project.hasProperty('forceCopyBack')) {
            logger.warn("Tunables copy-back skipped: ${live} is older than the seed on ${stale.size()} row(s) "
                    + "(${stale.take(3).join(', ')}${stale.size() > 3 ? ', ...' : ''}). It clears after that run "
                    + "starts and stops cleanly. -PforceCopyBack copies it anyway.")
            return
        }
    }

    // Write beside the seed then move, so a failure can't leave a half-written seed behind.
    def tmp = new File(tunablesSeedFile.parentFile, tunablesSeedFile.name + '.tmp')
    tmp.bytes = bytes
    java.nio.file.Files.move(tmp.toPath(), tunablesSeedFile.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    logger.lifecycle("Tunables synced: ${live} -> ${tunablesSeedFile}")
}

tasks.register('syncTunablesFromServer') {
    group = 'frontiermode'
    description = 'Copies run-server/config/satchel-tunables.csv over the seed in Satchel resources (guarded).'
    doLast { syncTunablesToSeed(project.file('run-server/config/satchel-tunables.csv')) }
}

tasks.register('syncTunablesFromClient') {
    group = 'frontiermode'
    description = 'Copies run/config/satchel-tunables.csv over the seed in Satchel resources (guarded).'
    doLast { syncTunablesToSeed(project.file('run/config/satchel-tunables.csv')) }
}

tasks.matching { it.name == 'runServer' }.configureEach { finalizedBy tasks.named('syncTunablesFromServer') }
tasks.matching { it.name == 'runClient' }.configureEach { finalizedBy tasks.named('syncTunablesFromClient') }

// IntelliJ launches (FRO_389). The IDE's runClient / runServer configurations are Application configurations: they
// run only :prepareRun<Side>Compile before the game and nothing in Gradle after it, so the finalizers above never
// fire. The same guarded copy therefore also runs on the prepare step, picking up what the PREVIOUS run of that
// side wrote, ahead of the jar build so the new jar carries it. These are separate tasks because one task cannot
// be both a prerequisite of a launch and its finalizer.
['Client': 'run', 'Server': 'run-server'].each { side, dir ->
    def beforeLaunch = tasks.register("syncTunablesBefore${side}Launch") {
        description = "Copy-back of the previous ${side.toLowerCase()} run's tunables, before an IDE launch (guarded)."
        doLast { syncTunablesToSeed(project.file("${dir}/config/satchel-tunables.csv")) }
    }
    tasks.matching { it.name == "prepareRun${side}Compile" }.configureEach { dependsOn beforeLaunch }
    tasks.matching { it.name == 'buildSatchel' || it.name == 'processResources' }.configureEach {
        mustRunAfter beforeLaunch
    }
}
