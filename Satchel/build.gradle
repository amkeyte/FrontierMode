import net.minecraftforge.gradle.userdev.tasks.RenameJarInPlace

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

// ------------------------------------------------------------
// Java
// ------------------------------------------------------------
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

println "Java: ${System.getProperty('java.version')}, JVM: ${System.getProperty('java.vm.version')} (${System.getProperty('java.vendor')}), Arch: ${System.getProperty('os.arch')}"

// ------------------------------------------------------------
// ForgeGradle / Minecraft
// ------------------------------------------------------------
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            // Own working dir so a concurrently-running client doesn't collide with the
            // server's saves/, logs/, server.properties, eula.txt (see run{} configureEach above).
            workingDirectory project.file('run-server')
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources'),
                    '--existing', file('src/main/resources')
        }
    }
}

// ------------------------------------------------------------
// Source sets
// ------------------------------------------------------------
sourceSets.main {
    java {
        srcDir 'src/main/java'
    }
    resources {
        srcDir 'src/main/resources'
        srcDir 'src/generated/resources'
    }
}

// ------------------------------------------------------------
// Repositories
// ------------------------------------------------------------
repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net' }
}

// ------------------------------------------------------------
// Dependencies
// ------------------------------------------------------------
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

// ------------------------------------------------------------
// Resource processing
// ------------------------------------------------------------
tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    def replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            forge_version           : forge_version,
            forge_version_range     : forge_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_version             : project.version,
            mod_authors             : mod_authors,
            mod_description         : mod_description,
            mod_license             : mod_license
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

// ------------------------------------------------------------
// Jar (DEV ONLY — NO REOBF HERE)
// ------------------------------------------------------------
tasks.named('jar', Jar).configure {
    //archiveClassifier.set("dev")

    manifest {
        attributes(
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        )
    }
}

// ------------------------------------------------------------
// Compile options
// ------------------------------------------------------------
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.withType(RenameJarInPlace).configureEach {
    enabled = true
}

tasks.matching { it.name.startsWith("reobf") }.configureEach {
    enabled = true
}

// ------------------------------------------------------------
// Reobfuscation [SAT_052] -- REQUIRED, was missing entirely. The `jar` task
// above ships mod code compiled against official/MCP names (e.g.
// `Commands.literal`, `FriendlyByteBuf.readUUID`). Forge's actual
// distributed runtime jar keeps its own classes under SRG names (e.g.
// `Commands.m_82127_`) -- ForgeGradle's dev run environment bridges that gap
// for you, which is why this was invisible in-IDE, but every real player
// install threw NoSuchMethodError/NoSuchFieldError on any vanilla member
// Satchel touched. Without this block, ForgeGradle never creates a
// `reobfJar` task at all, so the `tasks.matching{it.name.startsWith("reobf")}`
// line above silently matched nothing. `reobf { jar {} }` registers
// `reobfJar` (a RenameJarInPlace step, finalizing `jar`) that rewrites the
// `jar` task's output in place from official names to SRG names before it's
// shipped.
// ------------------------------------------------------------
reobf {
    jar {}
}
//jar {
//    archiveClassifier.set("dev")
//}
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

test {
    useJUnitPlatform()
}

// ------------------------------------------------------------
// Deploy dev jar into sibling FrontierMode project for local multi-mod testing
// ------------------------------------------------------------
tasks.register('copyToFrontierMode', Copy) {
    group = 'satchel'
    description = "Copies the dev jar into FrontierMode's run/mods and run-server/mods, removing stale Satchel jars first."

    def frontierRoot = file("${projectDir}/../FrontierMode")
    // client and dedicated server run out of separate working dirs (see FrontierMode's runs{}
    // server block), so both need their own copy of the Satchel jar on the mod-loading path.
    def frontierModsDirs = [file("${frontierRoot}/run/mods"), file("${frontierRoot}/run-server/mods")]

    // Copy the NON-obf dev jar. Do NOT depend on reobfJar here -- reobfJar
    // renames the jar in-place to SRG names, so depending on it would push an
    // obf'd jar into FrontierMode's run/mods, breaking dev runs.
    // For the obf'd release jar, use: ./gradlew release
    dependsOn tasks.named('jar')

    doFirst {
        if (!frontierRoot.exists()) {
            throw new GradleException("FrontierMode project not found at ${frontierRoot} — expected it as a sibling of Satchel.")
        }
        frontierModsDirs.each { dir ->
            dir.mkdirs()
            //dir.listFiles({ f -> f.name.startsWith('Satchel-') && f.name.endsWith('.jar') } as FileFilter)?.each { it.delete() }
            dir.listFiles({ f -> f.name.startsWith('Satchel') && f.name.endsWith('.jar') } as FileFilter)?.each { it.delete() }
        }
    }

    from tasks.named('jar').flatMap { it.archiveFile }
    into frontierModsDirs[0]
    doLast {
        frontierModsDirs.tail().each { dir ->
            copy {
                from tasks.named('jar').flatMap { it.archiveFile }
                into dir
            }
        }
    }
}

// ------------------------------------------------------------
// Release: reobfuscate and copy to C:/_local/mcRepos/Release/<version>/
// Run: ./gradlew release
// This is the ONLY place reobfJar is triggered; normal `jar` and
// `copyToFrontierMode` produce non-obf dev jars.
// ------------------------------------------------------------
tasks.register('release', Copy) {
    group = 'satchel'
    description = "Reobfuscates and copies the release jar to C:/_local/mcRepos/Release/${mod_version}/ for GitHub upload."
    dependsOn tasks.named('reobfJar')

    def releaseDir = file("C:/_local/mcRepos/Release/${mod_version}")

    doFirst {
        releaseDir.mkdirs()
    }

    from tasks.named('jar').flatMap { it.archiveFile }
    into releaseDir
}

// Gradle's JavaExec doesn't forward stdin to the child process by default, so console
// commands typed into the IntelliJ Run window (stop, op, etc.) silently go nowhere even
// though the server is alive and listening. This wires it through. Same fix as FrontierMode.
tasks.matching { it.name == 'runServer' }.configureEach {
    standardInput = System.in
}
